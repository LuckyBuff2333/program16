Global:
  text_score: 0.15
  use_det: true
  use_cls: false
  use_rec: true
  print_verbose: false
  min_height: 30
  width_height_ratio: 8
  max_side_len: 2000
  min_side_len: 30
  return_word_box: false
  intra_op_num_threads: 1
  inter_op_num_threads: 1
Det:
  intra_op_num_threads: 1
  inter_op_num_threads: 1
  use_cuda: true
  use_dml: false
  model_path: models/ppocrv5/det.onnx
  limit_side_len: 736
  limit_type: min
  std:
  - 0.5
  - 0.5
  - 0.5
  mean:
  - 0.5
  - 0.5
  - 0.5
  thresh: 0.3
  box_thresh: 0.3
  max_candidates: 1000
  unclip_ratio: 1.5
  use_dilation: true
  score_mode: fast
Cls:
  intra_op_num_threads: 1
  inter_op_num_threads: 1
  use_cuda: true
  use_dml: false
  model_path: models/ppocrv5/cls.onnx
  cls_image_shape:
  - 3
  - 80
  - 160
  cls_batch_num: 6
  cls_thresh: 0.9
  label_list:
  - '0'
  - '180'
Rec:
  intra_op_num_threads: 1
  inter_op_num_threads: 1
  use_cuda: true
  use_dml: false
  model_path: models/ppocrv5/rec.onnx
  rec_img_shape:
  - 3
  - 48
  - 320
  rec_batch_num: 6
  rec_keys_path: models/ppocrv5/ppocrv5_dict.txt
