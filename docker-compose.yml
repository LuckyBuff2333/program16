  #     MYSQL_ROOT_PASSWORD: root123
  #     MYSQL_DATABASE: bug_records
  #     MYSQL_USER: bugtool
  #     MYSQL_PASSWORD: bugtool123
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   networks:
  #     - bug-doc-net

networks:
  bug-doc-net:
    driver: bridge

