# 本机配置示例：复制为 config/config.yaml 后填入真实密钥
# 公共参数见 config/core_settings.json（已提交，不需要在这里重复）

diana:
  client_secret: <REPLACE_ME>
  prod_client_secret: <REPLACE_ME>
  prod_token_url: <REPLACE_ME>
  token_url: <REPLACE_ME>
feishu_bitable:
  app_secret: <REPLACE_ME>
  user_access_token: <REPLACE_ME>
  user_refresh_token: <REPLACE_ME>
  cookie: <REPLACE_ME>
feishu_bot:
  app_secret: <REPLACE_ME>
jira_api:
  token: <REPLACE_ME>

# ── 本地独有参数（不同步云端） ──
params:
  # EasyOCR 模型目录，避免运行时触发在线下载（留空则使用包内默认路径）
  easyocr_model_dir: ~/.EasyOCR/model

# ── OCR 配置（各机器独立，不跟随云端） ──
ocr:
  glm_priority: true  # 时间区域优先用本地 GLM-OCR，失败回退 RapidOCR
  glm_model_path: models/GLM-OCR  # 本机模型目录，可被 GLM_OCR_MODEL_PATH 覆盖
  engine: v5                  # OCR 引擎版本: v5(PP-OCRv5) / v4(PP-OCRv4)
  # 模型路径：本机独立配置，可写绝对路径；相对路径按项目根目录解析
  model_dir: models/ppocrv5
  det_model_path: models/ppocrv5/det.onnx
  cls_model_path: models/ppocrv5/cls.onnx
  rec_model_path: models/ppocrv5/rec.onnx
  rec_keys_path: models/ppocrv5/ppocrv5_dict.txt
  use_cuda: true              # NVIDIA独显+onnxruntime-gpu已安装时自动启用；集显/无独显自动关闭，设false可强制CPU
  use_dml: true              # AMD/其他显卡可改用 DirectML
  intra_op_num_threads: 1
  inter_op_num_threads: 1
  limit_side_len: 736
  limit_type: min
  max_side_len: 2000
  min_height: 30
  width_height_ratio: 8
  rec_batch_num: 6
  box_thresh: 0.3             # 检测阈值
  text_score: 0.15            # 文本分数阈值
  mag_ratio: 1.5              # 小图像放大比例（提升小字号识别率）
  max_pixels: 4000000
  oom_cooldown_sec: 300       # GPU OOM 后 CPU 冷却时间（秒）
  easyocr_languages:          # EasyOCR 回退语言
  - en
  - ch_sim
